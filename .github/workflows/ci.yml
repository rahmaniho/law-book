name: Test monorepo
on:
  pull_request:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /law-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck && npm test && npm run lint
      - run: npm run test:offline
